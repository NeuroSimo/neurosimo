name: "Example protocol"
description: "An example protocol consisting of 10 trials in a single stage"

execution:
  minimum_trial_interval: 2.0   # minimum seconds between consecutive trials
  repeat_failed_trials: true    # if true, a failed trial is repeated; if false, move on to the next trial

# Runtime parameters set in the UI and passed to the decider.
runtime_parameters:
  conditioning_intensity:
    label: Conditioning intensity
    type: float
    unit: "% MSO"
    min: 0
    max: 100

  test_intensity:
    label: Test intensity
    type: float
    unit: "% MSO"
    min: 0
    max: 100

stages:
  - stage:
      name: "example_stage"
      trials: 10
