name: "Example protocol with stages and rest periods"
description: "An example protocol demonstrating stages and rest periods"

execution:
  minimum_trial_interval: 2.0   # minimum seconds between consecutive trials
  repeat_failed_trials: true    # if true, a failed trial is repeated; if false, move on to the next trial

stages:
  - stage:
      name: "baseline"
      trials: 10
      notes: "Baseline measurement"
  
  - task:
      name: "train_classifier"
      notes: "Train classifier on baseline data"
  
  - stage:
      name: "intervention"
      trials: 10
      notes: "Main intervention phase"
