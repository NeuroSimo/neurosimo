[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurosimo-qualification"
version = "0.1.0"
description = "Offline temporal qualification reports for NeuroSimo recordings"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}

[project.scripts]
neurosimo-qualify = "neurosimo_qualification.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
